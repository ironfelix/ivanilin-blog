<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1000" width="1240" height="1000" role="img" aria-label="Архитектура ассистента: интерфейсы, ядро Hermes на vps, долговременная память, слой моделей, внешние источники через api и mcp">
<title>Архитектура ассистента на базе Hermes Agent</title>
<style>
  .t     { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .band  { font-size: 13px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; fill: #7a8a94; }
  .name  { font-size: 16px; font-weight: 600; fill: #2c3e50; }
  .core  { font-size: 17px; font-weight: 600; fill: #00695c; }
  .sub   { font-size: 12.5px; fill: #6b7c86; }
  .alt   { font-size: 12px; fill: #9aa8b0; font-style: italic; }
  .card  { fill: #ffffff; stroke: #dbe4e7; stroke-width: 1.5; }
  .cardA { fill: #e0f2f1; stroke: #4db6ac; stroke-width: 1.5; }
  .cardB { fill: #f7fafa; stroke: #cfdbdf; stroke-width: 1.5; }
  .cardW { fill: #fff8e6; stroke: #e0a800; stroke-width: 2; }
  .dot   { fill: #e0a800; }
  .flowW { stroke: #e0a800; stroke-width: 2.5; fill: none; }
  .watch { font-size: 11.5px; fill: #b58600; font-weight: 600; letter-spacing: .4px; }
  .zone  { fill: none; stroke: #cfdbdf; stroke-width: 1.5; stroke-dasharray: 6 5; }
  .flow  { stroke: #8fa3ac; stroke-width: 2; fill: none; }
  .flowD { stroke: #8fa3ac; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
  @media (prefers-color-scheme: dark) {
    .band { fill: #7f8f9a; } .name { fill: #ededed; } .core { fill: #80cbc4; }
    .sub  { fill: #9aa8b2; } .alt  { fill: #78858d; }
    .card { fill: #1e2426; stroke: #38434a; }
    .cardA{ fill: #12312e; stroke: #4db6ac; }
    .cardB{ fill: #191f21; stroke: #333d43; }
    .cardW { fill: #2a2415; stroke: #d9a520; }
    .dot   { fill: #d9a520; } .flowW { stroke: #d9a520; } .watch { fill: #c79a2e; }
    .zone { stroke: #3a464d; } .flow, .flowD { stroke: #63757f; }
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8fa3ac"/>
  </marker>
</defs>

<g class="t">

  <!-- ИНТЕРФЕЙСЫ -->
  <text x="30" y="34" class="band">Интерфейсы</text>
  <rect x="340" y="50" width="220" height="62" rx="10" class="card"/>
  <text x="450" y="78" class="name" text-anchor="middle">Telegram</text>
  <text x="450" y="98" class="sub"  text-anchor="middle">основной вход, голос и текст</text>

  <rect x="600" y="50" width="260" height="62" rx="10" class="card"/>
  <text x="730" y="78" class="name" text-anchor="middle">Терминал по ssh</text>
  <text x="730" y="98" class="sub"  text-anchor="middle">управление сервером, запуск агента</text>

  <text x="882" y="86" class="sub">память общая: начал голосом, продолжил текстом</text>

  <path d="M450,112 L450,130 M730,112 L730,130" class="flow"/>
  <path d="M450,130 L730,130" class="flow"/>
  <path d="M590,130 L590,182" class="flow" marker-end="url(#a)"/>

  <!-- ЯДРО -->
  <text x="30" y="178" class="band">Ядро Hermes Agent · vps</text>
  <rect x="30" y="192" width="1140" height="220" rx="14" class="zone"/>

  <rect x="230" y="214" width="740" height="60" rx="10" class="cardA"/>
  <text x="600" y="241" class="core" text-anchor="middle">Цикл агента</text>
  <text x="600" y="262" class="sub" text-anchor="middle">план → вызов инструмента → проверка результата → ответ</text>

  <rect x="984" y="206" width="170" height="76" rx="10" class="cardW"/>
  <circle cx="1004" cy="228" r="4.5" class="dot"/>
  <text x="1069" y="232" class="name" text-anchor="middle" font-size="15">Langfuse</text>
  <text x="1069" y="252" class="sub"  text-anchor="middle" font-size="11.5">смотрит за каждым ходом</text>
  <text x="1069" y="268" class="sub"  text-anchor="middle" font-size="11.5">трейс и latency по шагам</text>
  <path d="M972,244 L980,244" class="flowW"/>

  <path d="M600,274 L600,304" class="flow" marker-end="url(#a)"/>

  <rect x="60"  y="308" width="200" height="78" rx="10" class="cardB"/>
  <text x="160" y="341" class="name" text-anchor="middle">Файлы</text>
  <text x="160" y="363" class="sub"  text-anchor="middle">todo · идеи · конспекты</text>

  <rect x="278" y="308" width="200" height="78" rx="10" class="cardB"/>
  <text x="378" y="341" class="name" text-anchor="middle">Скиллы</text>
  <text x="378" y="363" class="sub"  text-anchor="middle">процедуры, пишутся сами</text>

  <rect x="496" y="308" width="200" height="78" rx="10" class="cardB"/>
  <text x="596" y="341" class="name" text-anchor="middle">Cron</text>
  <text x="596" y="363" class="sub"  text-anchor="middle">задачи по расписанию</text>

  <rect x="714" y="308" width="200" height="78" rx="10" class="cardB"/>
  <text x="814" y="341" class="name" text-anchor="middle">Субагенты</text>
  <text x="814" y="363" class="sub"  text-anchor="middle">долгий поиск в фоне</text>

  <rect x="932" y="308" width="208" height="78" rx="10" class="cardB"/>
  <text x="1036" y="341" class="name" text-anchor="middle">Сессии</text>
  <text x="1036" y="363" class="sub"  text-anchor="middle">история и сжатие контекста</text>

  <path d="M600,412 L600,462" class="flow" marker-end="url(#a)"/>

  <!-- ПАМЯТЬ HONCHO -->
  <text x="30" y="452" class="band">Долговременная память · Honcho</text>
  <rect x="30" y="466" width="1140" height="112" rx="14" class="zone"/>

  <rect x="48" y="484" width="356" height="76" rx="10" class="cardA"/>
  <text x="226" y="513" class="name" text-anchor="middle">Профиль строится сам</text>
  <text x="226" y="534" class="sub"  text-anchor="middle">смотрит диалоги, решает что запомнить,</text>
  <text x="226" y="550" class="sub"  text-anchor="middle">без ручного ввода</text>

  <rect x="420" y="484" width="356" height="76" rx="10" class="card"/>
  <text x="598" y="513" class="name" text-anchor="middle">Поиск по всем сессиям</text>
  <text x="598" y="534" class="sub"  text-anchor="middle">семантика плюс ключевые слова,</text>
  <text x="598" y="550" class="sub"  text-anchor="middle">а не только текущий чат</text>

  <rect x="792" y="484" width="360" height="76" rx="10" class="card"/>
  <text x="972" y="513" class="name" text-anchor="middle">Выжимка в начало диалога</text>
  <text x="972" y="534" class="sub"  text-anchor="middle">агент стартует, уже зная контекст</text>
  <text x="972" y="550" class="sub"  text-anchor="middle">проектов и предпочтений</text>

  <text x="48" y="404" class="alt">Langfuse свой, на своём сервере: показывает latency по шагам. Не обязателен, но без него непонятно, что именно тормозит.</text>
  <text x="30" y="598" class="alt">Внешний сервис. Работает и без него: у Hermes есть встроенная память в файлах, из бесплатных альтернатив есть mem0 и Zep.</text>

  <path d="M600,610 L600,660" class="flow" marker-end="url(#a)"/>

  <!-- МОДЕЛИ -->
  <text x="30" y="650" class="band">Модели · слой исследования</text>
  <rect x="30" y="664" width="1140" height="106" rx="14" class="zone"/>

  <rect x="48"  y="682" width="172" height="70" rx="10" class="cardA"/>
  <text x="134" y="710" class="name" text-anchor="middle" font-size="15">DeepSeek V4 Pro</text>
  <text x="134" y="730" class="sub"  text-anchor="middle" font-size="11.5">сейчас основная</text>

  <rect x="232" y="682" width="172" height="70" rx="10" class="card"/>
  <text x="318" y="710" class="name" text-anchor="middle" font-size="15">DeepSeek Flash</text>
  <text x="318" y="730" class="sub"  text-anchor="middle" font-size="11.5">фон и субагенты</text>

  <rect x="416" y="682" width="172" height="70" rx="10" class="card"/>
  <text x="502" y="710" class="name" text-anchor="middle" font-size="15">GPT-5.6 Codex</text>
  <text x="502" y="730" class="sub"  text-anchor="middle" font-size="11.5">сложные задачи и код</text>

  <rect x="600" y="682" width="172" height="70" rx="10" class="card"/>
  <text x="686" y="710" class="name" text-anchor="middle" font-size="15">Gemini 2.5 Flash</text>
  <text x="686" y="730" class="sub"  text-anchor="middle" font-size="11.5">картинки, документы</text>

  <rect x="784" y="682" width="172" height="70" rx="10" class="card"/>
  <text x="870" y="710" class="name" text-anchor="middle" font-size="15">Groq Whisper</text>
  <text x="870" y="730" class="sub"  text-anchor="middle" font-size="11.5">голос в текст</text>

  <rect x="968" y="682" width="172" height="70" rx="10" class="card"/>
  <text x="1054" y="710" class="name" text-anchor="middle" font-size="15">Kimi K3</text>
  <text x="1054" y="730" class="sub"  text-anchor="middle" font-size="11.5">пробовал, сравниваю</text>

  <text x="30" y="790" class="alt">Модель меняется одной строкой в конфиге. Смысл слоя не в конкретных именах, а в том, чтобы не зависеть от одного вендора.</text>

  <!-- ВНЕШНИЕ ИСТОЧНИКИ -->
  <text x="30" y="838" class="band">Внешние источники · api и mcp</text>
  <rect x="30" y="852" width="1140" height="94" rx="14" class="zone"/>

  <rect x="48"  y="870" width="158" height="58" rx="10" class="card"/>
  <text x="127" y="896" class="name" text-anchor="middle" font-size="15">Whoop</text>
  <text x="127" y="914" class="sub"  text-anchor="middle" font-size="11.5">сон, нагрузка</text>

  <rect x="216" y="870" width="176" height="58" rx="10" class="card"/>
  <text x="304" y="896" class="name" text-anchor="middle" font-size="15">Google Sheets</text>
  <text x="304" y="914" class="sub"  text-anchor="middle" font-size="11.5">финансы</text>

  <rect x="402" y="870" width="186" height="58" rx="10" class="card"/>
  <text x="495" y="896" class="name" text-anchor="middle" font-size="15">Google Calendar</text>
  <text x="495" y="914" class="sub"  text-anchor="middle" font-size="11.5">встречи</text>

  <rect x="598" y="870" width="196" height="58" rx="10" class="card"/>
  <text x="696" y="896" class="name" text-anchor="middle" font-size="15">PubMed и статьи</text>
  <text x="696" y="914" class="sub"  text-anchor="middle" font-size="11.5">исследования</text>

  <rect x="804" y="870" width="150" height="58" rx="10" class="card"/>
  <text x="879" y="896" class="name" text-anchor="middle" font-size="15">SearXNG</text>
  <text x="879" y="914" class="sub"  text-anchor="middle" font-size="11.5">поиск</text>

  <rect x="964" y="870" width="188" height="58" rx="10" class="cardA"/>
  <text x="1058" y="896" class="name" text-anchor="middle" font-size="15">Любой сервис с api</text>
  <text x="1058" y="914" class="sub"  text-anchor="middle" font-size="11.5">crm, github, mcp</text>

  <!-- ядро → источники, в обход справа -->
  <path d="M1170,347 L1208,347 L1208,899 L1158,899" class="flowD" marker-end="url(#a)"/>
  <text x="1196" y="640" class="sub" transform="rotate(-90 1196,640)" text-anchor="middle">вызовы инструментов</text>

  <text x="30" y="978" class="sub">Картинки, голос и сжатие маршрутизируются автоматически по конфигу. Codex подключается на сложные задачи. При отказе основной модели запросы уходят на запасную.</text>

</g>
</svg>
