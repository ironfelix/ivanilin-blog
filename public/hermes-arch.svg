<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" width="1240" height="880" role="img" aria-label="Архитектура ai-ассистента на базе Hermes Agent: интерфейсы, ядро на vps, модели и внешние источники">
<title>Архитектура ассистента: интерфейсы, ядро, модели, внешние источники</title>
<style>
  .t     { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .band  { font-size: 13px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; fill: #7a8a94; }
  .name  { font-size: 16px; font-weight: 600; fill: #2c3e50; }
  .core  { font-size: 17px; font-weight: 600; fill: #00695c; }
  .sub   { font-size: 12.5px; fill: #6b7c86; }
  .card  { fill: #ffffff; stroke: #dbe4e7; stroke-width: 1.5; }
  .cardA { fill: #e0f2f1; stroke: #4db6ac; stroke-width: 1.5; }
  .cardB { fill: #f7fafa; stroke: #cfdbdf; stroke-width: 1.5; }
  .zone  { fill: none; stroke: #cfdbdf; stroke-width: 1.5; stroke-dasharray: 6 5; }
  .flow  { stroke: #8fa3ac; stroke-width: 2; fill: none; }
  .flowD { stroke: #8fa3ac; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
  @media (prefers-color-scheme: dark) {
    .band  { fill: #7f8f9a; }
    .name  { fill: #ededed; }
    .core  { fill: #80cbc4; }
    .sub   { fill: #9aa8b2; }
    .card  { fill: #1e2426; stroke: #38434a; }
    .cardA { fill: #12312e; stroke: #4db6ac; }
    .cardB { fill: #191f21; stroke: #333d43; }
    .zone  { stroke: #3a464d; }
    .flow, .flowD { stroke: #63757f; }
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8fa3ac"/>
  </marker>
</defs>

<g class="t">

  <!-- ИНТЕРФЕЙСЫ -->
  <text x="30" y="40" class="band">Интерфейсы</text>
  <rect x="260" y="58" width="200" height="56" rx="10" class="card"/>
  <text x="360" y="92" class="name" text-anchor="middle">Telegram</text>
  <rect x="500" y="58" width="200" height="56" rx="10" class="card"/>
  <text x="600" y="92" class="name" text-anchor="middle">Терминал</text>
  <rect x="740" y="58" width="200" height="56" rx="10" class="card"/>
  <text x="840" y="92" class="name" text-anchor="middle">Веб-дашборд</text>
  <text x="962" y="92" class="sub">общая память на всех входах</text>

  <!-- шина: все три входа сходятся в одну линию -->
  <path d="M360,114 L360,132 M600,114 L600,132 M840,114 L840,132" class="flow"/>
  <path d="M360,132 L840,132" class="flow"/>
  <path d="M600,132 L600,186" class="flow" marker-end="url(#a)"/>

  <!-- ЯДРО -->
  <text x="30" y="182" class="band">Ядро Hermes Agent · vps</text>
  <rect x="30" y="196" width="1140" height="222" rx="14" class="zone"/>

  <rect x="230" y="220" width="740" height="62" rx="10" class="cardA"/>
  <text x="600" y="248" class="core" text-anchor="middle">Цикл агента</text>
  <text x="600" y="269" class="sub" text-anchor="middle">план → вызов инструмента → проверка результата → ответ</text>

  <path d="M600,282 L600,312" class="flow" marker-end="url(#a)"/>

  <rect x="60"  y="316" width="200" height="80" rx="10" class="cardB"/>
  <text x="160" y="350" class="name" text-anchor="middle">Память</text>
  <text x="160" y="372" class="sub"  text-anchor="middle">факты · профиль · сессии</text>

  <rect x="278" y="316" width="200" height="80" rx="10" class="cardB"/>
  <text x="378" y="350" class="name" text-anchor="middle">Скиллы</text>
  <text x="378" y="372" class="sub"  text-anchor="middle">процедуры, пишутся сами</text>

  <rect x="496" y="316" width="200" height="80" rx="10" class="cardB"/>
  <text x="596" y="350" class="name" text-anchor="middle">Cron</text>
  <text x="596" y="372" class="sub"  text-anchor="middle">задачи по расписанию</text>

  <rect x="714" y="316" width="200" height="80" rx="10" class="cardB"/>
  <text x="814" y="350" class="name" text-anchor="middle">Файлы</text>
  <text x="814" y="372" class="sub"  text-anchor="middle">todo · идеи · конспекты</text>

  <rect x="932" y="316" width="208" height="80" rx="10" class="cardB"/>
  <text x="1036" y="350" class="name" text-anchor="middle">Субагенты</text>
  <text x="1036" y="372" class="sub"  text-anchor="middle">долгий поиск в фоне</text>

  <!-- ядро → модели (по центру, без пересечений) -->
  <path d="M600,418 L600,508" class="flow" marker-end="url(#a)"/>
  <text x="612" y="470" class="sub">запрос уходит в модель по типу задачи</text>

  <!-- ядро → внешние источники (в обход, справа) -->
  <path d="M1170,352 L1208,352 L1208,742 L1178,742" class="flowD" marker-end="url(#a)"/>
  <text x="1196" y="560" class="sub" transform="rotate(-90 1196,560)" text-anchor="middle">вызовы инструментов</text>

  <!-- МОДЕЛИ -->
  <text x="30" y="500" class="band">Модели · маршрутизация по типу задачи</text>
  <rect x="30" y="516" width="1140" height="104" rx="14" class="zone"/>

  <rect x="48"  y="534" width="212" height="68" rx="10" class="cardA"/>
  <text x="154" y="562" class="name" text-anchor="middle">DeepSeek V4 Pro</text>
  <text x="154" y="583" class="sub"  text-anchor="middle">основная, весь диалог</text>

  <rect x="278" y="534" width="212" height="68" rx="10" class="card"/>
  <text x="384" y="562" class="name" text-anchor="middle">DeepSeek V4 Flash</text>
  <text x="384" y="583" class="sub"  text-anchor="middle">фон, сжатие, субагенты</text>

  <rect x="508" y="534" width="212" height="68" rx="10" class="card"/>
  <text x="614" y="562" class="name" text-anchor="middle">Gemini 2.5 Flash</text>
  <text x="614" y="583" class="sub"  text-anchor="middle">картинки и документы</text>

  <rect x="738" y="534" width="212" height="68" rx="10" class="card"/>
  <text x="844" y="562" class="name" text-anchor="middle">Groq Whisper</text>
  <text x="844" y="583" class="sub"  text-anchor="middle">голос в текст</text>

  <rect x="968" y="534" width="184" height="68" rx="10" class="card"/>
  <text x="1060" y="562" class="name" text-anchor="middle">GPT-5.6 Codex</text>
  <text x="1060" y="583" class="sub"  text-anchor="middle">сложный код</text>

  <!-- ВНЕШНИЕ ИСТОЧНИКИ -->
  <text x="30" y="680" class="band">Внешние источники</text>
  <rect x="30" y="696" width="1140" height="92" rx="14" class="zone"/>

  <rect x="48"  y="714" width="150" height="56" rx="10" class="card"/>
  <text x="123" y="740" class="name" text-anchor="middle" font-size="15">Whoop</text>
  <text x="123" y="758" class="sub"  text-anchor="middle" font-size="11.5">сон, нагрузка</text>

  <rect x="208" y="714" width="150" height="56" rx="10" class="card"/>
  <text x="283" y="740" class="name" text-anchor="middle" font-size="15">AgentIQ</text>
  <text x="283" y="758" class="sub"  text-anchor="middle" font-size="11.5">лиды</text>

  <rect x="368" y="714" width="164" height="56" rx="10" class="card"/>
  <text x="450" y="740" class="name" text-anchor="middle" font-size="15">Google Sheets</text>
  <text x="450" y="758" class="sub"  text-anchor="middle" font-size="11.5">финансы</text>

  <rect x="542" y="714" width="176" height="56" rx="10" class="card"/>
  <text x="630" y="740" class="name" text-anchor="middle" font-size="15">Google Calendar</text>
  <text x="630" y="758" class="sub"  text-anchor="middle" font-size="11.5">встречи</text>

  <rect x="728" y="714" width="150" height="56" rx="10" class="card"/>
  <text x="803" y="740" class="name" text-anchor="middle" font-size="15">PubMed</text>
  <text x="803" y="758" class="sub"  text-anchor="middle" font-size="11.5">статьи</text>

  <rect x="888" y="714" width="150" height="56" rx="10" class="card"/>
  <text x="963" y="740" class="name" text-anchor="middle" font-size="15">SearXNG</text>
  <text x="963" y="758" class="sub"  text-anchor="middle" font-size="11.5">поиск</text>

  <rect x="1048" y="714" width="104" height="56" rx="10" class="card"/>
  <text x="1100" y="740" class="name" text-anchor="middle" font-size="15">GitHub</text>
  <text x="1100" y="758" class="sub"  text-anchor="middle" font-size="11.5">деплой</text>

  <text x="30" y="828" class="sub">Картинки, голос и сжатие маршрутизируются автоматически по конфигу. Codex подключается по решению агента.</text>
  <text x="30" y="852" class="sub">При отказе основной модели запросы уходят на запасную, диалог не прерывается.</text>

</g>
</svg>
