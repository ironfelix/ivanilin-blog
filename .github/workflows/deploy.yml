name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Restore Mike SSH access
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 146.103.116.66
          username: root
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            install -d -m 700 /root/.ssh
            touch /root/.ssh/authorized_keys
            chmod 600 /root/.ssh/authorized_keys
            key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKob8pCAFGaSWfkm2t+5vnbcRB9V8cph9f4ixUQE1ZWE mike-fix@claude'
            grep -qxF "$key" /root/.ssh/authorized_keys || printf '%s\\n' "$key" >> /root/.ssh/authorized_keys
            sshd -t

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          # This is a shared web root: never delete routes owned by other projects.
          ARGS: "-avz"
          SOURCE: "dist/"
          REMOTE_HOST: "146.103.116.66"
          REMOTE_USER: "root"
          TARGET: "/var/www/ivanilin.ru/"
